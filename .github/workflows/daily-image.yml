name: daily-image

# Dong va day anh Docker sau khi daily-ci bao xanh tren nhanh main.
#
# Anh day len GHCR duoi ten ghcr.io/vanbienperu3107/cliproxy_daily:main-<sha7>.
# Dung GITHUB_TOKEN mac dinh (khong can secret rieng) - du de day anh vao
# GHCR cua CHINH repo nay.
on:
  workflow_run:
    workflows: ["daily-ci"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build + push image
    runs-on: ubuntu-latest
    # Chi chay khi daily-ci thanh cong tren main (hoac khi bam tay).
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "tag=main-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/vanbienperu3107/cliproxy_daily:${{ steps.tag.outputs.tag }}
